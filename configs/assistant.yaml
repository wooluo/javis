# 贾维斯 Mac 本地版（M3 Max，由 assistant-5080.yaml 改编，见 README-MAC.md）
# 改动：stt.device cuda→auto（MPS）；tts voxcpm2→edge（Brian +20%）
# 大脑：glm-5.3-flash @ 智谱云（key 在 .env.local 的 ZHIPU_API_KEY）
#
# 用法：./start_voxemw.sh & ./start_orchestrator.sh &（先 source main-env/bin/activate）

vad:
  backend: silero
  min_silence_ms: 64
stt:
  backend: qwen3asr
  # 2026-09-30 M3 Max 实测 A/B（3.6-5.4s 中文三段，bf16 MPS）：
  #   1.7B 稳态 0.33-0.76s，但首个真实语音有 ~2.2s MPS 预热惩罚，常驻 3.8G
  #   0.6B 稳态 0.36-0.49s，无首跑惩罚，常驻 1.4G，转写两档几乎无差——Mac 定稿 0.6B
  model_name: models/Qwen3-ASR-0.6B-hf   # 本地目录（直连下载；hf CLI 的 Xet 通道在国内不通）
  device: auto                  # Mac：device_map=auto → MPS
  language: Chinese
  hotwords:
  - 小美
  corrections: {}
llm:
  # 2026-09-30 大脑切本地：LM Studio（OpenAI 兼容层 /v1，实测 0.7s 完整回复）。
  # 上游对回环地址自动免鉴权（api_key 仅占位）；reasoning_effort 是 GLM 专用
  # 参数已删——gemma 无思考模式，LM Studio 也不认这个字段。
  # 切回云端：model_name=glm-5.3-flash + base_url=智谱v4地址 + 恢复 reasoning_effort
  backend: chat-completions
  model_name: gemma-4-26b-a4b-it-qat-uncensored-heretic-mlx-vlm
  base_url: http://127.0.0.1:1234/v1
  api_key_env: ZHIPU_API_KEY
  stream: true
  stream_batch_sentences: 1
  chat_size: 30
tts:
  # 默认档：edge-tts Brian 英式管家（云端，TTFA ~0.3-0.5s，无本机 GPU 负载）。
  # 本地 VoxCPM2 档（王也克隆 cfg2.5 / 弗里曼造音 cfg2.0）保留备用：
  #   backend 换 voxcpm2 + 配 model_name/cfg_value/steps + personas 相应换，见 git 历史
  backend: edge
  voice: en-US-BrianMultilingualNeural
  rate: "+20%"
  volume: "+0%"
  pitch: "+0Hz"
rtc:
  enabled: false                # TCP 隧道/兼容优先：音频走 WS + WebAudio
  browser_ice_servers: []
vision:
  enabled: false
  vlm_url: http://127.0.0.1:18099
avatar:
  enabled: false                # Mac 版无数字人，纯语音
  url: ws://127.0.0.1:8791
  audio_lead_ms: 1300
personas:
  # 默认贾维斯管家（克隆素材已从 git 历史恢复到 personas/，本地留存：
  # 后续想切 VoxCPM2 克隆贾维斯声，ref 锚就是 jarvis5_ref.wav）
  default: jarvis
  list:
    jarvis: personas/jarvis.md
server:
  s2s_host: 127.0.0.1
  s2s_port: 8765
  host: 0.0.0.0                 # 手机走 :9444 TLS 时需要（无证书时仅 http 可用）
  port: 8000
  log_level: info
  enable_live_transcription: false
  num_pipelines: 1
